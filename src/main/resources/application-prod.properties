# ==========================================
# PRODUCTION PROFILE - Spring Boot SPA
# ==========================================

# ---- HikariCP Pool (connection to Supabase pooler) ----
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000

# ---- JPA / Hibernate ----
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- Tomcat (Render free tier: 512 MB RAM) ----
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=100
server.tomcat.connection-timeout=10000

# ---- Jackson (disable lazy-load issues) ----
spring.jackson.serialization.fail-on-empty-beans=false

# ---- Logging (warn level = less noise) ----
logging.level.root=WARN
logging.level.com.proyect=INFO
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=INFO

# ---- Session ----
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
