spring.application.name=final_proyect_spa4

spring.datasource.url=jdbc:postgresql://REDACTED_DB_USER:REDACTED_DB_PASS@aws-0-us-east-1.pooler.supabase.com:6543/postgres
spring.datasource.username=${DB_USER}
spring.datasource.driver-class-name=org.postgresql.Driver

